<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>截图工坊 · Screenshot Studio</title>
<meta name="description" content="把任意应用截图做成 App Store 风格的高清展示图：局部放大、文案标注、多套排版模板、一键导出。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2314181f'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round'%3E%3Crect x='5' y='6' width='14' height='12' rx='3'/%3E%3Cpath d='M9 12h6M12 9.5v5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Playfair+Display:wght@600;700;800&display=swap" media="print" onload="this.media='all'">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect>
        <path d="M8 12.5h3.2M12.8 12.5h3.2M12 8.4v8.2"></path>
      </svg>
    </span>
    <span class="brand-text">截图工坊<em>Screenshot Studio</em></span>
  </div>

  <div class="topbar-mid">
    <span class="chip" id="statusSize">—</span>
    <span class="chip ghost" id="statusImg">未导入截图</span>
  </div>

  <div class="topbar-right">
    <div class="btn-group">
      <button class="btn icon" id="btnUndo" title="撤销 ⌘Z" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h9.5A6.5 6.5 0 0 1 14 22h-3"></path></svg>
      </button>
      <button class="btn icon" id="btnRedo" title="重做 ⇧⌘Z" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"></path><path d="M20 9H10.5A6.5 6.5 0 0 0 10 22h3"></path></svg>
      </button>
    </div>
    <button class="btn ghost" id="btnOpenProject" title="载入 .shot.json 工程文件">打开工程</button>
    <button class="btn ghost" id="btnSaveProject" title="保存工程文件">保存工程</button>
    <button class="btn ghost icon" id="btnReset" title="清空重做">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
    </button>
    <button class="btn primary" id="btnExport">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 19h16"></path></svg>
      导出图片
    </button>
  </div>
</header>

<div class="app">
  <nav class="rail" id="rail"></nav>
  <aside class="panel" id="panel"></aside>

  <main class="stage" id="stage">
    <div class="stage-scroll" id="stageScroll">
      <div class="frame" id="frame">
        <canvas id="canvas-main"></canvas>
        <canvas id="canvas-overlay"></canvas>
      </div>
    </div>

    <div class="stage-tools">
      <button class="btn icon mini" id="zoomOut" title="缩小">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
      </button>
      <span class="zoom-val" id="zoomVal">100%</span>
      <button class="btn icon mini" id="zoomIn" title="放大">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <span class="divider-v"></span>
      <button class="btn mini" id="zoomFit">适应窗口</button>
      <button class="btn mini" id="zoom100">100%</button>
    </div>

    <div class="dropzone" id="dropzone">
      <div class="dz-inner">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"></path><path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"></path></svg>
        <h2>把应用截图拖进来</h2>
        <p>也可以直接按 <b>⌘V</b> 粘贴剪贴板里的截图，或</p>
        <div class="dz-actions">
          <button class="btn primary" id="dzPick">选择图片</button>
        </div>
        <p class="dz-tip">支持 PNG / JPG / WebP · 手机截图建议宽度 ≥ 1170px 以获得最佳放大清晰度</p>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h3>精细框选放大区域</h3>
        <p>在左侧截图里拖动选择要放大的局部，右侧实时预览效果。</p>
      </div>
      <button class="btn icon" id="modalClose">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-pane">
        <div class="pane-label">源截图</div>
        <div class="modal-canvas-wrap" id="modalCanvasWrap"></div>
        <div class="hint-row" id="modalSrcInfo">拖动方块移动选区 · 拖角缩放 · 空白处拖拽重新框选</div>
      </div>
      <div class="modal-pane narrow">
        <div class="pane-label">放大效果预览</div>
        <div class="modal-preview" id="modalPreview"></div>
        <div class="hint-row">预览比例 = 画布上的实际显示大小</div>
      </div>
    </div>
    <div class="modal-foot">
      <label class="switch"><input type="checkbox" id="modalLock" checked><span>锁定选区比例（不变形）</span></label>
      <div class="spacer"></div>
      <button class="btn" id="modalSelectAll">全选整图</button>
      <button class="btn primary" id="modalDone">完成</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="projectInput" accept=".json,application/json" hidden>

<script src="assets/js/util.js"></script>
<script src="assets/js/zip.js"></script>
<script src="assets/js/presets.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
